; Home Observatory node firmware.
; Verified target: ESP8266EX, 4 MB flash (NodeMCU/D1-mini class, CH340 USB-UART).
; ESP32 profiles are documented as unverified in docs/hardware.md.
[platformio]
default_envs = esp8266-4m

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  256dpi/MQTT@2.5.2
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -DHO_FW_VERSION=\"0.1.2\"

[env:esp8266-4m]
platform = espressif8266@4.2.1
board = nodemcuv2
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
  ${env.build_flags}
  -DHO_PROFILE=\"esp8266-4m\"
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
