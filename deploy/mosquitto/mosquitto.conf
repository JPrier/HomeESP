# Production template. TLS listener with broker certificate; plaintext is disabled.
# See docs/operations.md for CA / certificate provisioning.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
max_packet_size 4096
max_inflight_messages 20
max_queued_messages 200
persistent_client_expiration 1d
log_type error
log_type warning
log_type notice
connection_messages true

listener 8883
max_connections 128
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
tls_version tlsv1.2

# Optional LAN plaintext listener for boards without a TLS profile (ESP8266 default
# build). Bind it to the LAN interface only and firewall it to the node subnet.
# listener 1883 192.0.2.10
