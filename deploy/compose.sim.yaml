# Simulation demo: synthetic nodes and scripted faults through the real ingest path.
# No broker, no hardware, no credentials, no real network probing (--simulate).
#   docker compose -f deploy/compose.sim.yaml up --build
#   -> http://127.0.0.1:18090   viewer token: sim-viewer-token-00000000000000
name: home-observatory-sim

services:
  sim:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: home-observatory:sim
    ports: ["127.0.0.1:18090:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /tmp/s &&
        printf 'operator=sim-operator-token-0000000000
viewer=sim-viewer-token-00000000000000
' > /tmp/s/api_tokens &&
        exec observatory-server --config /app/sim.yaml --simulate
    volumes:
      - ../configs/sim-demo.yaml:/app/sim.yaml:ro
